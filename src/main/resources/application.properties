spring.application.name=eba
spring.datasource.url=jdbc:mysql://localhost:3306/eba?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Upload de material académico (PDF, DOCX, fotos)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
eba.uploads.dir=uploads
